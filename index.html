<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trans Rights World Map</title>
  <meta name="description" content="Visualise transgender rights and legal recognition around the world, country by country.">
  <link rel="canonical" href="https://transindex.org/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://transindex.org/">
  <meta property="og:site_name" content="TransIndex.org">
  <meta property="og:title" content="Trans Rights World Map">
  <meta property="og:description" content="Visualise transgender rights and legal recognition around the world, country by country.">
  <!-- Uses the project icon from the README. A 1200x630 og-image.png in the repo would
       render better; swap this URL and set twitter:card to summary_large_image if you add one. -->
  <meta property="og:image" content="https://github.com/user-attachments/assets/e06b78b9-8e0e-4373-b59c-0bbdf3a27813">
  <meta property="og:image:alt" content="The TransIndex.org project icon.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0f0f14">
  <!-- frame-ancestors/X-Frame-Options can't be set from a meta tag or GitHub Pages; see README. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header>
    <div class="brand-block">
      <h1>TransIndex.org</h1>
    </div>

    <div class="search-zone">
      <label class="control search-control" for="country-search">
        <span>Search</span>
        <div class="field-shell">
          <input id="country-search" type="search" role="combobox" placeholder="Find a country" autocomplete="off" aria-autocomplete="list" aria-controls="country-suggestions" aria-expanded="false">
          <button class="clear-field" id="clear-search" type="button" aria-label="Clear search">×</button>
        </div>
      </label>
      <div id="country-suggestions" class="suggestion-list" role="listbox" aria-label="Country suggestions"></div>
    </div>

    <div class="header-controls" aria-label="Map controls">
      <label class="control question-control" for="question-filter">
        <span>Question</span>
        <div class="field-shell">
          <select id="question-filter"><option value="all">All questions</option></select>
          <button class="clear-field" id="clear-question" type="button" aria-label="Clear question filter">×</button>
        </div>
      </label>
      <label class="control status-control" for="status-filter">
        <span>Status</span>
        <select id="status-filter" disabled>
          <option value="all">Any status</option>
          <option value="yes">Yes</option>
          <option value="partial">Partial / varies</option>
          <option value="no">No</option>
          <option value="death" hidden disabled>Death penalty</option>
          <option value="unknown">No data</option>
        </select>
      </label>
    </div>
  </header>

  <main class="main">
    <div id="map-container">
      <div class="tooltip" id="tooltip"></div>
      <div id="map-legend" aria-live="polite"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
        <button class="zoom-btn" id="zoom-reset" aria-label="Reset zoom">↺</button>
      </div>
    </div>

    <div id="panel">
      <div id="panel-header">
        <span class="drawer-handle-bar"></span>
        <div class="drawer-handle-content">
          <div id="panel-country">Select a country</div>
          <div id="panel-sub">Click on the map</div>
        </div>
      </div>

      <div id="panel-filters">
        <button class="filters-toggle" id="filters-toggle" type="button">
          <span>Filters</span>
          <span class="filters-toggle-arrow">▼</span>
        </button>
        <div class="filters-body is-collapsed" id="filters-body">
          <div class="filter-row">
            <span>Question</span>
            <select id="question-filter-mobile"><option value="all">All questions</option></select>
          </div>
          <div class="filter-row">
            <span>Status</span>
            <select id="status-filter-mobile" disabled>
              <option value="all">Any status</option>
              <option value="yes">Yes</option>
              <option value="partial">Partial / varies</option>
              <option value="no">No</option>
              <option value="death" hidden disabled>Death penalty</option>
              <option value="unknown">No data</option>
            </select>
          </div>
        </div>
      </div>

      <div id="panel-legend">
        <button class="filters-toggle" id="legend-toggle" type="button">
          <span>Map legend</span>
          <span class="filters-toggle-arrow">▼</span>
        </button>
        <div class="filters-body is-collapsed" id="panel-legend-body"></div>
      </div>

      <div id="panel-body">
        <div id="panel-empty">
          <div class="arrow">↑</div>
          <p>Select any country<br>on the map to see<br>data on transgender rights.</p>
        </div>
        <div id="panel-rights" style="display:none"></div>
      </div>

      <div class="source-note">
        <span class="disclaimer">
			Data compiled manually and may be inaccurate or out of date. More information on the <a href="https://github.com/dreamerscript/Trans-Index" target="_blank" rel="noopener noreferrer">GitHub Project Page</a>.
		</span>
        <div class="theme-picker">
          <button class="theme-trigger" id="theme-trigger" type="button" aria-label="Choose theme" aria-haspopup="menu" aria-expanded="false" aria-controls="theme-menu">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3a9 9 0 0 0 0 18h1.8a1.8 1.8 0 0 0 0-3.6h-.9a1.8 1.8 0 0 1 0-3.6h1.8A5.4 5.4 0 0 0 20.1 8.4 5.4 5.4 0 0 0 14.7 3Z"></path>
              <path d="M7.5 10.5h.01M9 6.75h.01M5.25 14.25h.01"></path>
            </svg>
            <span class="theme-trigger-label">Theme</span>
          </button>
          <div class="theme-menu" id="theme-menu" role="menu" aria-label="Choose theme">
            <button type="button" class="theme-option" role="menuitemradio" data-theme="dark" aria-checked="true">
              <span class="theme-swatch theme-swatch-dark" aria-hidden="true"></span><span>Dark</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="light" aria-checked="false">
              <span class="theme-swatch theme-swatch-light" aria-hidden="true"></span><span>Light</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="high-contrast" aria-checked="false">
              <span class="theme-swatch theme-swatch-high-contrast" aria-hidden="true"></span><span>High contrast</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="latte" aria-checked="false">
              <span class="theme-swatch theme-swatch-latte" aria-hidden="true"></span><span>Latte</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="frappe" aria-checked="false">
              <span class="theme-swatch theme-swatch-frappe" aria-hidden="true"></span><span>Frappé</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="mocha" aria-checked="false">
              <span class="theme-swatch theme-swatch-mocha" aria-hidden="true"></span><span>Mocha</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="sylveon" aria-checked="false">
              <span class="theme-swatch theme-swatch-sylveon" aria-hidden="true"></span><span>Sylveon</span>
            </button>
            <button type="button" class="theme-option" role="menuitemradio" data-theme="sepia" aria-checked="false">
              <span class="theme-swatch theme-swatch-sepia" aria-hidden="true"></span><span>Sepia</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js" integrity="sha384-su5kReKyYlIFrI62mbQRKXHzFobMa7BHp1cK6julLPbnYcCW9NIZKJiTODjLPeDh" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js" integrity="sha384-9dCJK6nh7skY14HrcvlLYlFga9/MehJjL9ONWRflmiXNRuf8p2jiF4Y5PR881PTq" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="rights.js"></script>
<script src="map.js"></script>
</body>
</html>
